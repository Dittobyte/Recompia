# Builds the macOS port on Apple Silicon and runs the headless graphics smoke test (docs/macos-port.md M6).
# The game itself needs a dump and is not part of this: the demo (apps/gfx_demo.cpp) renders its own scene through the same
# NVN/Vulkan back end on MoltenVK, so it proves the build, the runtime, the address-space layout and the graphics path.
name: macOS

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'recomp/**'
      - 'game-build/**'
      - 'launcher/**'
      - '.github/workflows/macos.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'recomp/**'
      - 'game-build/**'
      - 'launcher/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14          # arm64, the port's target
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          brew update
          brew install cmake ninja molten-vk

      - name: Configure
        run: cd runtime && cmake --preset macos-arm64

      - name: Build
        run: cd runtime && cmake --build --preset macos-arm64 -j 4

      - name: Graphics smoke test (headless, MoltenVK)
        run: |
          cd runtime
          ./build/macos-arm64/nxrt_gfx_demo --headless --frames 30 --screenshot /tmp/demo.png --shot-frame 29
          test -s /tmp/demo.png

      - name: Address-space self test
        run: ./runtime/build/macos-arm64/nxrt_memprobe

      - name: Launcher (front end + Rust)
        run: |
          cd launcher
          npm ci
          npm run build
          cd src-tauri && cargo check

      - uses: actions/upload-artifact@v4
        with:
          name: pkp-macos-arm64
          path: |
            runtime/build/macos-arm64/nxrt_gfx_demo
            runtime/build/macos-arm64/nxrt_memprobe
          if-no-files-found: error
