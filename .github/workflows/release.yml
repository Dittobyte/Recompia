# Builds the player zip (game-build/scripts/make-release.ps1). A tag v<x.y.z> publishes it as a GitHub release, its notes taken from
# that version's section of CHANGELOG.md. Manual runs only build it (artifact), unless they name a release tag: run on main with
# release_tag = v<x.y.z>, they publish it the same way and GitHub creates the tag on the commit that was built. No test or pull
# request checks.
# Testing channel: a tag v<x.y.z>-alpha.N, -beta.N or -rc.N (run on the `testing` branch) publishes a GitHub PRERELEASE. The launcher's
# Stable channel never offers it; players who chose Testing do. Its notes come from its own CHANGELOG section if there is one, else from
# the Unreleased section, else a short generic text.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as this release (v<x.y.z> from main; v<x.y.z>-beta.N, -alpha.N or -rc.N, a Testing prerelease, from the testing branch; GitHub creates the tag). Empty: build only.'
        required: false
        default: ''

permissions:
  contents: write

env:
  LLVM_VERSION: 23.1.4
  RYUBING_COMMIT: a82350bb774f70fcbd41c9987bf67a3775409963
  # package the third-party payload comes from (make-release.ps1): the upstream v0.1.1 repository is gone, so our own last release
  BASE_REPO: Dittobyte/Recompia
  BASE_RELEASE: v0.8.2
  # the release this run publishes: the pushed tag, or a manual run's release_tag; empty = build only
  REL_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if ($env:REL_TAG -and $env:GITHUB_REF_TYPE -ne 'tag') {
            if ($env:REL_TAG -match '^v\d+\.\d+\.\d+-(alpha|beta|rc)\.\d+$') {
              if ($env:GITHUB_REF -ne 'refs/heads/testing') { throw "a Testing release_tag publishes from the testing branch only (this run: $env:GITHUB_REF)" }
            } else {
              if ($env:GITHUB_REF -ne 'refs/heads/main') { throw "release_tag publishes from main only (this run: $env:GITHUB_REF)" }
              if ($env:REL_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "release_tag '$env:REL_TAG' is not v<x.y.z> or v<x.y.z>-beta.N" }
            }
          }
          $v = if ($env:REL_TAG) { $env:REL_TAG -replace '^v', '' } else { '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV
          "PRERELEASE=$(if ($v -match '-') { 'true' } else { 'false' })" >> $env:GITHUB_ENV

      - name: LLVM ${{ env.LLVM_VERSION }}
        run: |
          $msi = "$env:RUNNER_TEMP\llvm.msi"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.msi" -OutFile $msi -MaximumRetryCount 5 -RetryIntervalSec 30   # GitHub answers this large download with a 504 now and then
          Start-Process msiexec -Wait -ArgumentList '/i', $msi, '/qn'
          & 'C:\Program Files\LLVM\bin\clang-cl.exe' --version
          'C:\Program Files\LLVM\bin' >> $env:GITHUB_PATH

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja
        run: choco install ninja -y --no-progress

      - name: libvpx cache
        id: vpx
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libvpx-x64-windows-static-v1

      - name: libvpx
        if: steps.vpx.outputs.cache-hit != 'true'
        run: C:\vcpkg\vcpkg.exe install libvpx:x64-windows-static

      - name: Texture tools (astc2bc7, astcdec DLLs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/textures/scripts/fetch_third_party.ps1
          ./tools/textures/scripts/build.ps1

      # github.com's direct release-asset downloads answered 504 for hours on 2026-11-08 while the release API kept working. CMake's FetchContent
      # reuses a file in NXRT_DEPS_DIR (%LOCALAPPDATA%\nxrt\deps) when its SHA-256 matches, so the two release assets are put there first through the API.
      # A failure here is not fatal: CMake then downloads them itself, as before.
      - name: Pre-fetch release assets (API route)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $d = Join-Path $env:LOCALAPPDATA 'nxrt\deps'
          New-Item -ItemType Directory -Force $d | Out-Null
          gh release download release-3.4.18 -R libsdl-org/SDL -p SDL3-3.4.18.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'SDL3 pre-fetch failed; CMake will download it' }
          gh release download v1.5.7 -R facebook/zstd -p zstd-1.5.7.tar.gz -D $d --clobber
          if ($LASTEXITCODE) { Write-Warning 'zstd pre-fetch failed; CMake will download it' }
          exit 0

      # The four archive dependencies (runtime/cmake/gfx_deps.cmake) come from codeload.github.com, which kept working while github.com/.../archive
      # answered 503 on 2026-11-08. Each is checked against the same SHA-256 that CMake pins, extracted, and handed to CMake as its source
      # (FETCHCONTENT_SOURCE_DIR_*). Any problem here leaves that dependency to CMake's own download, as before.
      - name: Pre-fetch dependency sources (codeload)
        run: |
          $root = Join-Path $PWD 'build/depsrc'
          New-Item -ItemType Directory -Force $root | Out-Null
          $deps = @(
            @{ n = 'VULKAN_HEADERS'; u = 'https://codeload.github.com/KhronosGroup/Vulkan-Headers/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = 'f4be95220ff0ee0b1c620301ff4fe9ae48592d71f4c30f2d5c571351a153ae81' },
            @{ n = 'VOLK'; u = 'https://codeload.github.com/zeux/volk/zip/refs/tags/vulkan-sdk-1.4.363.0'; h = '889b90fdcbe9cee7b118339d640c6895b7be5c920d309c44b744692063275b3d' },
            @{ n = 'VMA'; u = 'https://codeload.github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/zip/refs/tags/v3.4.0'; h = 'ce9a61ea5e72284ac9ccc152c214eef381ab57bfd7383f20232e5a652e3afda6' },
            @{ n = 'IMGUI'; u = 'https://codeload.github.com/ocornut/imgui/zip/refs/tags/v1.92.9b'; h = 'e1c46d676c2bcb7ced847ba27f50553e33a19db97b3cadaec7f8be64449139f8' }
          )
          $dargs = @()
          foreach ($d in $deps) {
            $zip = Join-Path $root "$($d.n).zip"
            curl.exe -fL --retry 5 --retry-delay 15 --retry-all-errors -o $zip $d.u
            if ($LASTEXITCODE -ne 0) { Write-Warning "$($d.n): download failed, CMake will fetch it"; continue }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $d.h) { Write-Warning "$($d.n): checksum differs, CMake will fetch it"; continue }
            $out = Join-Path $root $d.n
            Expand-Archive $zip $out -Force
            $inner = Get-ChildItem $out -Directory | Select-Object -First 1
            if (-not $inner) { Write-Warning "$($d.n): nothing extracted"; continue }
            $dargs += "-DFETCHCONTENT_SOURCE_DIR_$($d.n)=$($inner.FullName -replace '\\', '/')"
          }
          "CMAKE_DEP_ARGS=$($dargs -join ' ')" >> $env:GITHUB_ENV
          Write-Output "dependency overrides: $($dargs.Count) of $($deps.Count)"
          exit 0

      - name: pkp_rt.dll
        run: |
          $depArgs = @()
          if ($env:CMAKE_DEP_ARGS) { $depArgs = @($env:CMAKE_DEP_ARGS -split ' ' | Where-Object { $_ }) }
          cmake -S game-build -B build/rtdll -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
                -DPKP_RT_DLL=ON -DPKP_RELEASE=ON "-DPKP_VERSION=$env:VERSION" @depArgs
          if ($LASTEXITCODE) { exit 1 }
          cmake --build build/rtdll --target pkp_rt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher
        working-directory: launcher
        run: |
          if ($env:REL_TAG) {   # the launcher window shows its own version
            $c = 'src-tauri/tauri.conf.json'; (Get-Content -Raw $c) -replace '"version": "[^"]*"', "`"version`": `"$env:VERSION`"" | Set-Content -NoNewline $c
            $t = 'src-tauri/Cargo.toml'; (Get-Content -Raw $t) -replace '(?m)^version = "[^"]*"', "version = `"$env:VERSION`"" | Set-Content -NoNewline $t
          }
          if ($env:GITHUB_REF -eq 'refs/heads/testing') {   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            Copy-Item -Force src-tauri/icons-testing/* src-tauri/icons/
          }
          npm ci
          # the Settings page against the runtime's schemas: among others every gameplay mod on by default (the runtime's own table is
          # held to that by PKP_GAMEPLAY_DEFAULTS_CHECK in the pkp_rt.dll step), so a test build's default cannot ship
          node scripts/test-settings-schema.mjs
          if ($LASTEXITCODE) { exit 1 }
          npm run tauri build
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Shader translator
        run: |
          git clone --filter=blob:none https://git.ryujinx.app/ryubing/ryujinx.git refs/ryubing
          git -C refs/ryubing checkout $env:RYUBING_COMMIT
          ./tools/shaders/scripts/setup_ryujinx.ps1
          dotnet publish -c Release -r win-x64 --self-contained true tools/shaders/harness/SpirvHarness.csproj -o build/harness
          if ($LASTEXITCODE) { exit 1 }

      - name: Package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BASE_RELEASE -R $env:BASE_REPO -p '*-win64.zip' -D build/base
          ./game-build/scripts/make-release.ps1 -Version $env:VERSION -Base (Get-Item build/base/*.zip).FullName -RtDir build/rtdll `
              -Launcher launcher/src-tauri/target/release/pokopia-launcher.exe -Harness build/harness -Out build/rel

      - name: Checksums
        run: |
          $z = Get-Item build/rel/*.zip
          $h = (Get-FileHash -Algorithm SHA256 $z.FullName).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/build/rel/SHA256SUMS.txt", "$h *$($z.Name)`n")
          Get-Content build/rel/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-win64
          path: |
            build/rel/*.zip
            build/rel/SHA256SUMS.txt
          compression-level: 0

      - name: Publish
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Get-Content -Raw CHANGELOG.md
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($env:VERSION))[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success -and $env:PRERELEASE -eq 'true') {   # a Testing build may have no section of its own: the Unreleased one, else a short text
            $m = [regex]::Match($log, "(?ms)^## Unreleased[^\r\n]*\r?\n(.*?)(?=^## |\z)")
          }
          if ($m.Success) { $m.Groups[1].Value.Trim() | Set-Content build/notes.md }
          elseif ($env:PRERELEASE -eq 'true') { "A Testing build: newer than the latest stable release and less tested. Please report problems on GitHub with pkp.log and say you were on Testing." | Set-Content build/notes.md }
          else { throw "CHANGELOG.md has no section '## $env:VERSION'" }
          if ($env:PRERELEASE -eq 'true') {   # a Testing build lists what was merged into testing since the previous release; a failure here never blocks the release
            try {
              $prev = gh release list --limit 1 --json tagName --jq '.[0].tagName'
              if ($prev) {
                git fetch --quiet --unshallow origin 2>$null
                git fetch --quiet origin "+refs/tags/${prev}:refs/tags/${prev}"
                $changes = @()
                foreach ($h in (git log --merges --format='%H' "$prev..HEAD")) {
                  $subject = git show -s --format='%s' $h
                  $title = git show -s --format='%b' $h | Where-Object { $_.Trim() } | Select-Object -First 1
                  $n = [regex]::Match($subject, '#(\d+)').Groups[1].Value
                  if ($n -and $title) { $changes += "- #$n $($title.Trim())" }
                }
                if ($changes.Count) {
                  $body = Get-Content -Raw build/notes.md
                  ("### Changes in this build`n" + ($changes -join "`n") + "`n`n" + $body) | Set-Content build/notes.md
                }
              }
            } catch { Write-Host "Changes in this build: skipped ($_)" }
            try {   # and how to report, so the release page says it too
              $report = "`n`n### How to report`nOpen [a bug report](https://github.com/featureJosh/pokopia-recomp/issues/new?template=bug_report.yml), choose **Testing** as the channel, say which version you have, and attach ``pkp.log`` (and ``setup.log`` if Set up ran). Thank you for testing."
              Add-Content -Path build/notes.md -Value $report
            } catch { Write-Host "How to report: skipped ($_)" }
          }
          $env:BUILD = [regex]::Match($log, "(?m)^## $([regex]::Escape($env:VERSION)) \(build ([^)\r\n]+)\)").Groups[1].Value
          $title = "Pokopia Recomp $env:VERSION" + $(if ($env:BUILD) { " (build $env:BUILD)" } elseif ($env:PRERELEASE -eq 'true') { " (Testing)" } else { "" })
          if ($env:PRERELEASE -eq 'true') {
            gh release create $env:REL_TAG --target $env:GITHUB_SHA (Get-Item build/rel/*.zip).FullName build/rel/SHA256SUMS.txt --title $title --notes-file build/notes.md --prerelease
          } else {
            gh release create $env:REL_TAG --target $env:GITHUB_SHA (Get-Item build/rel/*.zip).FullName build/rel/SHA256SUMS.txt --title $title --notes-file build/notes.md
          }

  # The Linux package: the Windows zip above (the runtime, the build kit, the shader translator: they run through Proton) with the
  # Linux launcher as an AppImage in place of PokopiaLauncher.exe, which does not start under Proton (no WebView2). A tag adds it
  # to the release; manual runs without release_tag only build it (artifact).
  linux:
    needs: release
    # Ubuntu 22.04: the AppImage then needs glibc 2.35 (Ubuntu 22.04, Debian 12, Mint 21, SteamOS), not 24.04's 2.39
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ -n "$REL_TAG" ]; then v=${REL_TAG#v}; else v=0.0.0; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Launcher (AppImage)
        working-directory: launcher
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1     # linuxdeploy is an AppImage itself; no FUSE on the runner
          NO_STRIP: true
        run: |
          if [ -n "$REL_TAG" ]; then   # the launcher window shows its own version
            sed -i -E "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          if [ "$GITHUB_REF" = "refs/heads/testing" ]; then   # a Testing build has its own icon (the Stable icons stay in the repository untouched)
            cp -f src-tauri/icons-testing/* src-tauri/icons/
          fi
          npm ci --no-audit --no-fund
          # linuxdeploy and its plugins are downloaded from GitHub while bundling; a failed download (HTTP 504, a missing plugin) fails the
          # job although nothing is wrong with the code (0.8.2 and beta.12). The compiled launcher is reused, so a retry only repeats the bundling.
          for try in 1 2 3; do
            if npm run tauri build -- --bundles appimage --config '{"bundle":{"active":true}}'; then break; fi
            [ "$try" = 3 ] && { echo "::error::the AppImage could not be bundled after 3 tries"; exit 1; }
            echo "::warning::AppImage bundling failed (try $try of 3), trying again in 30 s"
            rm -rf src-tauri/target/release/bundle/appimage
            sleep 30
          done
          ls -la src-tauri/target/release/bundle/appimage/

      - name: AppImage runtime without FUSE 2
        # linuxdeploy's runtime needs libfuse2, which Ubuntu 24.04 and others no longer install; the static type2 runtime
        # (pinned) needs none. The AppImage is that runtime followed by the same squashfs.
        env:
          RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          RUNTIME_SHA256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
        run: |
          curl -fsSL --retry 3 -o runtime-x86_64 "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  runtime-x86_64" | sha256sum -c -
          ai=$(ls launcher/src-tauri/target/release/bundle/appimage/*.AppImage)
          off=$(APPIMAGE_EXTRACT_AND_RUN=1 "$ai" --appimage-offset)
          { cat runtime-x86_64; tail -c +$((off + 1)) "$ai"; } > "$ai.new"
          chmod 755 "$ai.new" && mv "$ai.new" "$ai"
          "$ai" --appimage-offset

      - uses: actions/download-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-win64
          path: build/win

      - name: Package
        run: |
          mkdir -p build/stage build/rel
          unzip -q build/win/PokopiaRecomp-$VERSION-win64.zip -d build/stage
          pkg=build/stage/PokopiaRecomp-$VERSION
          test -d "$pkg/tools/build" || { echo "unexpected zip layout"; ls build/stage; exit 1; }
          # Windows-only parts: the launcher, the start script, the embedded Python and Zig (Set up fetches the Linux ones)
          rm -rf "$pkg/PokopiaLauncher.exe" "$pkg/Play.bat" "$pkg/tools/python" "$pkg/tools/build/zig"
          sed "s/@VERSION@/$VERSION/g" game-build/release_b/README.linux.txt > "$pkg/README.txt"
          # machine translations of that README (README.<lang>.txt), when the repository has them
          for t in game-build/release_b/README.linux.*.txt; do
            [ -f "$t" ] || continue
            lang="${t#game-build/release_b/README.linux.}"; lang="${lang%.txt}"
            sed "s/@VERSION@/$VERSION/g" "$t" > "$pkg/README.$lang.txt"
          done
          install -m 755 launcher/src-tauri/target/release/bundle/appimage/*.AppImage "$pkg/PokopiaLauncher.AppImage"
          tar -C build/stage -czf build/rel/PokopiaRecomp-$VERSION-linux-x64.tar.gz PokopiaRecomp-$VERSION
          (cd build/rel && sha256sum -b PokopiaRecomp-$VERSION-linux-x64.tar.gz | tee linux.sha256)
          ls -la build/rel

      - name: Smoke test (the AppImage starts and finds tools/)
        run: |
          sudo apt-get install -y -q --no-install-recommends xvfb
          cd build/stage/PokopiaRecomp-$VERSION
          (APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 xvfb-run -a ./PokopiaLauncher.AppImage > ../launch.log 2>&1; echo "exit $?" >> ../launch.log) || true
          cat ../launch.log
          grep -q "exit 124" ../launch.log || { echo "the launcher did not keep running"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: PokopiaRecomp-${{ env.VERSION }}-linux-x64
          path: build/rel/*.tar.gz
          compression-level: 0

      - name: Publish
        if: env.REL_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$REL_TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -D build/sums
          sed -E 's/^([0-9a-f]+) \*?(.*)$/\1 *\2/' build/rel/linux.sha256 >> build/sums/SHA256SUMS.txt
          cat build/sums/SHA256SUMS.txt
          gh release upload "$REL_TAG" -R "$GITHUB_REPOSITORY" build/rel/PokopiaRecomp-$VERSION-linux-x64.tar.gz build/sums/SHA256SUMS.txt --clobber
