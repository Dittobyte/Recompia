<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9783f"/><stop offset=".45" stop-color="#d79b5c"/><stop offset="1" stop-color="#a5672f"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3a865"/><stop offset=".5" stop-color="#e6774a"/><stop offset="1" stop-color="#c63a2a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5f962c"/><stop offset="1" stop-color="#8cc04a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.6" flood-color="#12332b" flood-opacity=".28"/></filter>
  </defs>
  <g filter="url(#soft)" transform="rotate(-38 60 60)">
    <!-- the handle, wood, rounded like the logo's strokes -->
    <rect x="53" y="40" width="14" height="66" rx="7" fill="url(#wood)"/>
    <rect x="57" y="46" width="3" height="54" rx="1.5" fill="#f1c48c" opacity=".55"/>
    <!-- the head: the logo's ball colours, its wavy highlight -->
    <rect x="28" y="18" width="64" height="30" rx="13" fill="url(#head)"/>
    <path d="M32 31 C38 25 42 36 48 30 C54 24 58 36 64 30 C70 24 74 36 80 30 C84 26 87 29 88 31 L88 27 C88 22 84 21 80 21 L40 21 C35 21 32 24 32 27 Z" fill="#f6b673" opacity=".9"/>
    <rect x="36" y="22.5" width="12" height="4" rx="2" fill="#fff" opacity=".35"/>
    <!-- a small leaf from the head, like the logo's -->
    <path d="M70 19 C72 9 82 5 92 8 C88 15 80 20 70 19 Z" fill="url(#leaf)"/>
    <path d="M71 18.5 C77 13 83 10 89 9" stroke="#4f7f22" stroke-width="1" fill="none" opacity=".5"/>
  </g>
</svg>
